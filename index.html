<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collagen Index | UK Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Premium Wellness Color Palette */
            --background: #FCFAF8; 
            --surface: #FFFFFF;
            --border: #EBE5DF;
            --text-main: #2D2A26; 
            --text-muted: #857F7A;
            --accent: #C4A792; 
            --accent-hover: #b3937d;
            
            /* Subtle Tag Colors */
            --tag-marine-bg: #F0F4F6;
            --tag-marine-text: #5A7684;
            --tag-bovine-bg: #F9F1EB;
            --tag-bovine-text: #967056;
            --tag-multi-bg: #F5F0F6;
            --tag-multi-text: #78647C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--surface);
            padding: 1.25rem 3rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        header h1 a {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 0.02em;
            text-decoration: none;
        }

        header nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 400;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        header nav a:hover {
            color: var(--accent);
        }

        .dashboard-container {
            display: flex;
            flex: 1;
            flex-direction: row;
            align-items: flex-start; /* Allows children to define their own height */
        }

        /* Sidebar Styling - Now Sticky */
        .sidebar {
            width: 280px;
            background-color: var(--background);
            border-right: 1px solid var(--border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: sticky;
            top: 73px; /* Sits just below the sticky header */
            height: calc(100vh - 73px);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .filter-group h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            background-color: var(--surface);
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23857F7A%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
        }

        select:hover, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196, 167, 146, 0.1);
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            padding: 2rem;
            background-color: var(--background);
            min-width: 0; /* Prevents flex blowout on mobile */
        }

        /* Table Container - Allows horizontal scroll only on mobile */
        .table-container {
            background-color: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 800px; 
            border-collapse: collapse;
            text-align: left;
        }

        /* Condensed Padding for rows */
        th, td {
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            background-color: var(--surface);
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #FCFAF8;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .product-name {
            font-weight: 300;
            font-size: 0.95rem;
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .tag-marine { background-color: var(--tag-marine-bg); color: var(--tag-marine-text); }
        .tag-bovine { background-color: var(--tag-bovine-bg); color: var(--tag-bovine-text); }
        .tag-multi { background-color: var(--tag-multi-bg); color: var(--tag-multi-text); }

        .price-text {
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        /* Buy Now Button */
        .buy-btn {
            display: inline-block;
            background-color: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            text-decoration: none;
            padding: 0.45rem 1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        /* Coming Soon State */
        .buy-btn.coming-soon {
            background-color: var(--surface);
            color: var(--text-muted);
            border: 1px dashed var(--text-muted);
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .buy-btn.coming-soon:hover {
            background-color: var(--surface);
            border-color: var(--text-muted);
            color: var(--text-muted);
            box-shadow: none;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--surface);
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }

        /* Mobile Responsive Breakpoint */
        @media (max-width: 768px) {
            header {
                padding: 1rem 1.25rem;
            }

            header h1 a {
                font-size: 1.4rem;
            }

            .dashboard-container {
                flex-direction: column;
            }

            /* Un-stick the sidebar on mobile so it stacks naturally */
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 1.25rem;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
                gap: 1rem;
                position: relative; 
                top: 0;
                height: auto;
                overflow-y: visible;
                background-color: var(--surface);
            }

            .filter-group {
                margin: 0;
            }

            .main-content {
                padding: 1.25rem;
            }
            
            th, td {
                padding: 0.75rem 1rem;
            }
        }
    </style>
</head>
<body>

            { brand: "Revive Collagen", product: "Original Marine Drink (28 Days)", source: "Marine", dose: "8.5g", price: 56.99 },

            // Zooki
            { brand: "Zooki", product: "Collagen Zooki (Liposomal)", source: "Marine", dose: "5g", price: 27.99 }
        ];

        const tableBody = document.getElementById('table-body');
        const brandFilter = document.getElementById('brand-filter');
        const sourceFilter = document.getElementById('source-filter');
        const sortFilter = document.getElementById('sort-filter');

        function getSourceTag(source) {
            const lowerSource = source.toLowerCase();
            return `<span class="tag tag-${lowerSource}">${source}</span>`;
        }

        function renderTable(products) {
            tableBody.innerHTML = ''; 
            
            if (products.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 3rem; color: var(--text-muted);">No products match your current wellness criteria.</td></tr>';
                return;
            }

            products.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="brand-name">${item.brand}</td>
                    <td class="product-name">${item.product}</td>
                    <td>${getSourceTag(item.source)}</td>
                    <td>${item.dose}</td>
                    <td class="price-text">£${item.price.toFixed(2)}</td>
                    <td><a href="#" class="buy-btn coming-soon" onclick="event.preventDefault();">Buy Now (Coming Soon)</a></td>
                `;
                tableBody.appendChild(row);
            });
        }

        function updateView() {
            let filteredData = [...data];

            const brandValue = brandFilter.value;
            const sourceValue = sourceFilter.value;
            const sortValue = sortFilter.value;

            if (brandValue !== 'all') {
                filteredData = filteredData.filter(item => item.brand === brandValue);
            }

            if (sourceValue !== 'all') {
                filteredData = filteredData.filter(item => item.source === sourceValue);
            }

            if (sortValue === 'price-asc') {
                filteredData.sort((a, b) => a.price - b.price);
            } else if (sortValue === 'price-desc') {
                filteredData.sort((a, b) => b.price - a.price);
            }

            renderTable(filteredData);
        }

        brandFilter.addEventListener('change', updateView);
        sourceFilter.addEventListener('change', updateView);
        sortFilter.addEventListener('change', updateView);

        renderTable(data);
    </script>
